<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">游戏风格转译图鉴 Game Style Transfer Atlas — 同一条街，15 种游戏画风</title>
  <desc id="desc">深色 HUD 底标题：游戏风格转译图鉴，副标题同一条街，15 种游戏画风；右侧是同一条街景在塞尔达、黑暗之魂 III、艾尔登法环三种风格下的转译色板。</desc>

  <rect width="1200" height="360" rx="26" fill="#0b0e14"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#22c55e">游戏风格转译图鉴 · STYLE TRANSFER ATLAS</text>
    <text x="56" y="128" font-size="54" font-weight="700" fill="#f8fafc">游戏风格转译图鉴</text>
    <text x="56" y="168" font-size="23" fill="#e2e8f0">同一条街，15 种游戏画风</text>
    <text x="56" y="204" font-size="19" fill="#94a3b8">纽约 × 京都 × 上海，三组实景，45 张示例。</text>
    <g id="chips" font-size="18" fill="#e2e8f0" text-anchor="middle">
      <g><rect x="56" y="238" width="118" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="115" y="262">15 款游戏</text></g>
      <g><rect x="186" y="238" width="118" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="245" y="262">45 张示例</text></g>
      <g><rect x="316" y="238" width="118" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="375" y="262">3 组实景</text></g>
      <g><rect x="446" y="238" width="148" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="520" y="262">提示词可复制</text></g>
    </g>
  </g>

  <g id="panels" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="panel-zelda">
      <rect x="720" y="48" width="128" height="244" rx="10" fill="#8fd0e8"/>
      <rect x="720" y="228" width="128" height="64" rx="0" fill="#4a9e5c"/>
      <g fill="#2f7a4d"><rect x="732" y="170" width="30" height="58"/><rect x="806" y="150" width="30" height="78"/></g>
      <g fill="#f2c200"><polygon points="786,96 812,96 806,120 792,120"/><rect x="790" y="120" width="18" height="108"/><polygon points="782,148 816,148 810,168 788,168"/><polygon points="780,188 818,188 812,206 786,206"/></g>
      <circle cx="824" cy="80" r="14" fill="#fff7ae"/>
      <g><rect x="720" y="306" width="128" height="36" fill="#0b0e14"/><text x="784" y="330" font-size="18" fill="#cbd5e1" text-anchor="middle">塞尔达</text></g>
    </g>
    <g id="panel-souls">
      <rect x="864" y="48" width="128" height="244" rx="10" fill="#3a3f4a"/>
      <rect x="864" y="228" width="128" height="64" rx="0" fill="#26282e"/>
      <g fill="#1c1e24"><rect x="876" y="170" width="30" height="58"/><rect x="950" y="150" width="30" height="78"/></g>
      <g fill="#6b7078"><polygon points="930,96 956,96 950,120 936,120"/><rect x="934" y="120" width="18" height="108"/><polygon points="926,148 960,148 954,168 932,168"/><polygon points="924,188 962,188 956,206 930,206"/></g>
      <circle cx="968" cy="80" r="14" fill="#9aa0aa"/>
      <g><rect x="864" y="306" width="128" height="36" fill="#0b0e14"/><text x="928" y="330" font-size="18" fill="#cbd5e1" text-anchor="middle">黑暗之魂 III</text></g>
    </g>
    <g id="panel-elden">
      <rect x="1008" y="48" width="128" height="244" rx="10" fill="#f0b429"/>
      <rect x="1008" y="228" width="128" height="64" rx="0" fill="#6b5316"/>
      <g fill="#8a6d2f"><rect x="1020" y="170" width="30" height="58"/><rect x="1094" y="150" width="30" height="78"/></g>
      <g fill="#d99a1f"><polygon points="1074,96 1100,96 1094,120 1080,120"/><rect x="1078" y="120" width="18" height="108"/><polygon points="1070,148 1104,148 1098,168 1076,168"/><polygon points="1068,188 1112,188 1106,206 1074,206"/></g>
      <circle cx="1112" cy="80" r="14" fill="#fff3c4"/>
      <g><rect x="1008" y="306" width="128" height="36" fill="#0b0e14"/><text x="1072" y="330" font-size="18" fill="#cbd5e1" text-anchor="middle">艾尔登法环</text></g>
    </g>
  </g>
</svg>
